name: OptLevi Android ARM64 test build

on:
  push:
    branches:
      - feature/optlevi-native-menu
      - feature/levi-api-resource-ui
      - feature/optlevi-menu-touch-bridge
      - feature/pause-ui-fabric-menu
    paths:
      - "scripts/prepare-optlevi.py"
      - "scripts/prepare-levi-api.py"
      - "scripts/prepare-fabric-layout.py"
      - "scripts/build-resource-pack.py"
      - "resources/levi_api/**"
      - "assets/**"
      - "scripts/package-optlevi.py"
      - "scripts/prepare-optlevi-touch.py"
      - "src/android/**"
      - "scripts/test-optlevi-touch.py"
      - "scripts/test-optlevi-pause-ui.py"
      - "docs/ui-research-log.md"
      - ".github/workflows/optlevi-android.yml"
      - "patches/modmenube/**"
  pull_request:
    paths:
      - "scripts/prepare-optlevi.py"
      - "scripts/prepare-levi-api.py"
      - "scripts/prepare-fabric-layout.py"
      - "scripts/build-resource-pack.py"
      - "resources/levi_api/**"
      - "assets/**"
      - "scripts/package-optlevi.py"
      - ".github/workflows/optlevi-android.yml"
      - "patches/modmenube/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optlevi-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OptLevi and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Apply verified LeviLauncher compatibility patch
        run: |
          git -C ModMenuBE apply --check "$GITHUB_WORKSPACE/patches/modmenube/0001-align-current-levilauncher.patch"
          git -C ModMenuBE apply "$GITHUB_WORKSPACE/patches/modmenube/0001-align-current-levilauncher.patch"

      - name: Apply OptLevi native mod branding
        run: python3 scripts/prepare-optlevi.py

      - name: Replace floating launcher button with Levi API resource UI
        run: |
          python3 scripts/prepare-levi-api.py
          python3 scripts/prepare-fabric-layout.py
          python3 scripts/build-resource-pack.py

      - name: Check Fabric-inspired native layout rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          screen = Path("ModMenuBE/src/ui/ModMenuScreen.cpp").read_text()
          widgets = Path("ModMenuBE/src/ui/OreTheme.cpp").read_text()
          pause = Path("resources/levi_api/ui/pause_screen.json").read_text()
          assert 'titleText = "Mods";' in screen
          assert 'col::rgb(0x15171C, 188)' in screen
          assert 'Showing %d mods' in screen
          assert 'col::rgb(0x343A45, 225)' in screen
          assert 'width * 0.5f - s(65)' in screen
          assert 'col::rgb(0xD3D8E2, 230)' in widgets
          assert '"size": [22, 24]' in pause or '"size": [\n    22,\n    24\n  ]' in pause
          print("Fabric layout, translucent panels, flat buttons and compact pause icon: OK")
          PY

      - name: Verify resource UI event contract
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib
          p = pathlib.Path("build/OptLevi-LeviAPI-0.2.0.mcpack")
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              assert "ui/start_screen.json" in z.namelist()
              assert "ui/pause_screen.json" in z.namelist()
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["modules"][0]["type"] == "resources"
              button = json.loads(z.read("ui/start_screen.json"))
              key = "optlevi_menu_button@common_buttons.light_text_form_fitting_button"
              assert button[key]["$pressed_button_name"] == "button.optlevi_open_menu"
              assert button["start_screen_content"]["modifications"][0]["control_name"] == "skin_panel"
              assert "pack_icon.png" in z.namelist()
          entry = pathlib.Path("ModMenuBE/android/src/Entry.cpp").read_text()
          assert "ButtonBuilder" not in entry, "Old native floating button still present"
          assert "registerModule" in entry
          print("Static JSON UI contract and floating-button removal verified")
          PY

      - name: Install OptLevi native button touch bridge
        run: |
          python3 scripts/prepare-optlevi-touch.py
          python3 - <<'PY'
          from pathlib import Path
          entry = Path("ModMenuBE/android/src/Entry.cpp").read_text()
          bridge = Path("ModMenuBE/android/src/GameUiTouchBridge.cpp").read_text()
          cmake = Path("ModMenuBE/android/CMakeLists.txt").read_text()
          assert "gameui::install();" in entry
          assert "gameui::uninstall();" in entry
          assert "src/GameUiTouchBridge.cpp" in cmake
          assert "pl::input::registerTouchCallback" in bridge
          assert "openMenu();" in bridge
          assert "ButtonBuilder" not in entry
          print("Native touch bridge statically connected; runtime behavior needs device test")
          PY

      - name: Check original Mods button geometry and native touch path
        run: python3 scripts/test-optlevi-touch.py

      - name: Validate pause Mods, Shaders and UI study contract
        run: python3 scripts/test-optlevi-pause-ui.py

      - name: Configure ARM64
        run: |
          cmake -S ModMenuBE/android -B build/optlevi-arm64-v8a -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build .levipack
        run: cmake --build build/optlevi-arm64-v8a --target levi_package --parallel 2

      - name: Verify package and architecture
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib
          p = pathlib.Path("build/optlevi-arm64-v8a/OptLevi-0.1.0-arm64-v8a.levipack")
          assert p.is_file(), f"Missing {p}"
          with zipfile.ZipFile(p) as z:
              expected = {"OptLevi/manifest.json", "OptLevi/icon.png", "OptLevi/LICENSE", "OptLevi/libOptLevi.so"}
              assert expected <= set(z.namelist()), z.namelist()
              manifest = json.loads(z.read("OptLevi/manifest.json"))
              assert manifest["name"] == "OptLevi", manifest
              assert manifest["entry"] == "libOptLevi.so", manifest
              assert z.read("OptLevi/libOptLevi.so")[:4] == bytes((0x7f,)) + b"ELF"
          print("OptLevi archive structure and manifest verified")
          PY
          readelf -h build/optlevi-arm64-v8a/package/OptLevi/libOptLevi.so | grep -q AArch64

      - name: Assemble complete LeviPack with original project icon
        run: python3 scripts/package-optlevi.py

      - name: Verify complete embedded pack and original icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import json, struct

          package = Path("build/OptLevi-0.2.0-arm64-v8a.levipack")
          assert package.is_file(), package
          prefix = "OptLevi/resources/minecraft_resource_packs/LeviAPI/"
          original = Path("assets/optlevi-original-200.png").read_bytes()
          with ZipFile(package) as z:
              manifest = json.loads(z.read("OptLevi/manifest.json"))
              assert manifest["name"] == "OptLevi"
              assert manifest["entry"] == "libOptLevi.so"
              assert manifest["overwrite_folders"] == ["resources/minecraft_resource_packs"]
              assert manifest["icon"] == "icon.png"
              for path in ["manifest.json", "ui/start_screen.json", "ui/pause_screen.json", "ui/_ui_defs.json", "pack_icon.png"]:
                  assert prefix + path in z.namelist(), path
              assert z.read("OptLevi/icon.png") == original
              assert z.read(prefix + "pack_icon.png") == original
              assert struct.unpack(">II", original[16:24]) == (200, 200)
              assert z.read("OptLevi/libOptLevi.so")[:4] == bytes((127,)) + b"ELF"
              ui = json.loads(z.read(prefix + "ui/start_screen.json"))
              button = ui["optlevi_menu_button@common_buttons.light_text_form_fitting_button"]
              assert button["$pressed_button_name"] == "button.optlevi_open_menu"
          print("Complete resource injection layout and original 200x200 icon verified")
          print("Icon SHA-256:", sha256(original).hexdigest())
          print("NOTE: Native Bedrock JSON-UI event callback is not implemented")
          PY

      - name: Upload complete OptLevi resource-integrated LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OptLevi-0.2.0-arm64-v8a-complete
          path: build/OptLevi-0.2.0-arm64-v8a.levipack
          if-no-files-found: error
          retention-days: 14

      - name: Upload Levi API resource pack
        uses: actions/upload-artifact@v4
        with:
          name: OptLevi-LeviAPI-0.2.0
          path: build/OptLevi-LeviAPI-0.2.0.mcpack
          if-no-files-found: error
          retention-days: 14

      - name: Upload OptLevi native module (no embedded assets — test only)
        uses: actions/upload-artifact@v4
        with:
          name: OptLevi-native-only-0.1.0-arm64-v8a
          path: build/optlevi-arm64-v8a/OptLevi-0.1.0-arm64-v8a.levipack
          if-no-files-found: error
          retention-days: 14
